spring.application.name=VaultPay

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/vaultpay?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
# JWT Security Configuration
vaultpay.jwt.secret=${VAULTPAY_JWT_SECRET}

# Server Configuration
server.port=8080

# Security Logging
logging.level.org.springframework.security=INFO

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Application Information
info.app.name=VaultPay
info.app.description=Digital Banking and Ledger System
info.app.version=1.0.0

# Spring AI - Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.7
